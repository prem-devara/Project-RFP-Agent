<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" width="720" height="248" role="img" aria-label="Labelling process" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><rect width="720" height="248" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5FBF"/></marker></defs><rect x="20" y="20" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5"/><text x="95.0" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">1. Select RFPs</text><text x="95.0" y="63" text-anchor="middle" font-size="11.5" fill="#3A3F48">4 public RFPs:</text><text x="95.0" y="78" text-anchor="middle" font-size="11.5" fill="#3A3F48">1 to build, 3 to test</text><rect x="285" y="20" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5"/><text x="360.0" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">2. Write rulebook</text><text x="360.0" y="63" text-anchor="middle" font-size="11.5" fill="#3A3F48">What counts as a</text><text x="360.0" y="78" text-anchor="middle" font-size="11.5" fill="#3A3F48">requirement; 7 categories</text><rect x="550" y="20" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5"/><text x="625.0" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">3. Choose pages</text><text x="625.0" y="63" text-anchor="middle" font-size="11.5" fill="#3A3F48">Long RFPs: sections</text><text x="625.0" y="78" text-anchor="middle" font-size="11.5" fill="#3A3F48">labelled completely</text><rect x="20" y="150" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5"/><text x="95.0" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">4. Label by hand</text><text x="95.0" y="193" text-anchor="middle" font-size="11.5" fill="#3A3F48">Section, page, category</text><text x="95.0" y="208" text-anchor="middle" font-size="11.5" fill="#3A3F48">and exact quote</text><rect x="285" y="150" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5"/><text x="360.0" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">5. Check quotes</text><text x="360.0" y="193" text-anchor="middle" font-size="11.5" fill="#3A3F48">Every quote checked</text><text x="360.0" y="208" text-anchor="middle" font-size="11.5" fill="#3A3F48">against the PDF</text><rect x="550" y="150" width="150" height="78" rx="8" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5"/><text x="625.0" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">6. Save answer keys</text><text x="625.0" y="193" text-anchor="middle" font-size="11.5" fill="#3A3F48">Before the agent ran</text><text x="625.0" y="208" text-anchor="middle" font-size="11.5" fill="#3A3F48">on the test RFPs</text><line x1="170" y1="59" x2="283" y2="59" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah)"/><line x1="435" y1="59" x2="548" y2="59" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah)"/><path d="M625,98 L625,124 L95,124 L95,148" fill="none" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah)"/><line x1="170" y1="189" x2="283" y2="189" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah)"/><line x1="435" y1="189" x2="548" y2="189" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah)"/></svg>