<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 496" width="720" height="496" role="img" aria-label="AI workflow" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><rect width="720" height="496" fill="#FFFFFF"/><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5FBF"/></marker></defs><rect x="195" y="10" width="150" height="56" rx="8" fill="#F7F7F5" stroke="#1F5FBF" stroke-width="1.5" stroke-dasharray="5 4"/><text x="270.0" y="34" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Claude desktop app</text><text x="270.0" y="53" text-anchor="middle" font-size="11.5" fill="#3A3F48">Q&amp;A with the RFP</text><rect x="375" y="10" width="150" height="56" rx="8" fill="#F7F7F5" stroke="#1F5FBF" stroke-width="1.5" stroke-dasharray="5 4"/><text x="450.0" y="34" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Rulebook</text><text x="450.0" y="53" text-anchor="middle" font-size="11.5" fill="#3A3F48">Same as for labelling</text><rect x="15" y="130" width="150" height="86" rx="8" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5"/><text x="90.0" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">RFP PDF</text><text x="90.0" y="173" text-anchor="middle" font-size="11.5" fill="#3A3F48">Public RFP,</text><text x="90.0" y="188" text-anchor="middle" font-size="11.5" fill="#3A3F48">up to 112 pages</text><rect x="195" y="130" width="150" height="86" rx="8" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5"/><text x="270.0" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">MCP server</text><text x="270.0" y="173" text-anchor="middle" font-size="11.5" fill="#3A3F48">Returns the RFP</text><text x="270.0" y="188" text-anchor="middle" font-size="11.5" fill="#3A3F48">text page by page</text><rect x="375" y="130" width="150" height="86" rx="8" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5"/><text x="450.0" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Agent</text><text x="450.0" y="173" text-anchor="middle" font-size="11.5" fill="#3A3F48">Finds requirements,</text><text x="450.0" y="188" text-anchor="middle" font-size="11.5" fill="#3A3F48">assigns categories</text><rect x="555" y="130" width="150" height="86" rx="8" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5"/><text x="630.0" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Code checks</text><text x="630.0" y="173" text-anchor="middle" font-size="11.5" fill="#3A3F48">Flags bad quotes and</text><text x="630.0" y="188" text-anchor="middle" font-size="11.5" fill="#3A3F48">categories; sends agent</text><text x="630.0" y="203" text-anchor="middle" font-size="11.5" fill="#3A3F48">back for skipped pages</text><line x1="270" y1="68" x2="270" y2="128" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah2)"/><line x1="450" y1="68" x2="450" y2="128" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah2)"/><line x1="165" y1="173.0" x2="193" y2="173.0" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah2)"/><line x1="345" y1="173.0" x2="373" y2="173.0" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah2)"/><line x1="525" y1="156.0" x2="553" y2="156.0" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah2)"/><line x1="555" y1="190.0" x2="527" y2="190.0" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah2)"/><text x="540" y="236" text-anchor="middle" font-size="11" font-style="italic" fill="#1F5FBF">pages skipped:</text><text x="540" y="250" text-anchor="middle" font-size="11" font-style="italic" fill="#1F5FBF">back to agent</text><line x1="630" y1="218" x2="630" y2="298" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah2)"/><text x="640" y="262.0" text-anchor="start" font-size="11" font-style="italic" fill="#1F5FBF">all pages read</text><rect x="555" y="300" width="150" height="86" rx="8" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5"/><text x="630.0" y="324" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Checklist</text><text x="630.0" y="343" text-anchor="middle" font-size="11.5" fill="#3A3F48">Excel + JSON: page,</text><text x="630.0" y="358" text-anchor="middle" font-size="11.5" fill="#3A3F48">category, exact quote</text><rect x="375" y="300" width="150" height="86" rx="8" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5"/><text x="450.0" y="324" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Judge AI</text><text x="450.0" y="343" text-anchor="middle" font-size="11.5" fill="#3A3F48">Compares checklist</text><text x="450.0" y="358" text-anchor="middle" font-size="11.5" fill="#3A3F48">with answer keys</text><rect x="195" y="300" width="150" height="86" rx="8" fill="#EEF3FB" stroke="#1F5FBF" stroke-width="1.5"/><text x="270.0" y="324" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Recall &amp; precision</text><text x="270.0" y="343" text-anchor="middle" font-size="11.5" fill="#3A3F48">Scored on</text><text x="270.0" y="358" text-anchor="middle" font-size="11.5" fill="#3A3F48">3 test RFPs</text><rect x="375" y="430" width="150" height="56" rx="8" fill="#F7F7F5" stroke="#1F5FBF" stroke-width="1.5" stroke-dasharray="5 4"/><text x="450.0" y="454" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Answer keys</text><text x="450.0" y="473" text-anchor="middle" font-size="11.5" fill="#3A3F48">From the labelling process</text><line x1="553" y1="343.0" x2="527" y2="343.0" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah2)"/><line x1="373" y1="343.0" x2="347" y2="343.0" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah2)"/><line x1="450" y1="428" x2="450" y2="388" stroke="#1F5FBF" stroke-width="1.5" marker-end="url(#ah2)"/></svg>